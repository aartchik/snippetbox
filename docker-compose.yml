services:
  db:
    image: mysql:8
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DB_PORT:-3308}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 10s
    volumes:
      - dbdata:/var/lib/mysql
  test-db:
    profiles: ["test"]
    image: mysql:8
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: test_snippetbox
      MYSQL_USER: test_web
      MYSQL_PASSWORD: pass
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 10s
    volumes:
      - testdbdata:/var/lib/mysql
  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      [
        "-path", "/migrations",
        "-database", "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(db:3306)/${MYSQL_DATABASE}?multiStatements=true",
        "up"
      ]
    restart: "no"

  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-4000}:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command:
      - ./server
      - -dsn=${SNIPPETBOX_DSN:-web:pass@tcp(db:3306)/snippetbox?parseTime=true}
      - -static-dir=/app/ui/static
      - -redis-addr=${REDIS_ADDR:-redis:6379}
      - -redis-password=${REDIS_PASSWORD:-}
      - -redis-db=${REDIS_DB:-0}

  caddy:
    profiles: ["prod"]
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      app:
        condition: service_started

  test:
    profiles: ["test"]
    image: golang:1.25.6
    working_dir: /app
    depends_on:
      test-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    environment:
      SNIPPETBOX_TEST_DSN: test_web:pass@tcp(test-db:3306)/test_snippetbox?parseTime=true&multiStatements=true&time_zone=%27%2B00%3A00%27
      SNIPPETBOX_TEST_REDIS_ADDR: redis:6379
      SNIPPETBOX_TEST_REDIS_DB: "1"
    command: ["sh", "-c", "go mod tidy && go test ./..."]
volumes:
  dbdata:
  redisdata:
  testdbdata:
  caddydata:
  caddyconfig:
