services:
  db:
    image: postgres:17
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-snippetbox}
      POSTGRES_USER: ${POSTGRES_USER:-web}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data
  test-db:
    profiles: ["test"]
    image: postgres:17
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${TEST_POSTGRES_DB:-test_snippetbox}
      POSTGRES_USER: ${TEST_POSTGRES_USER:-test_web}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-pass}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 10s
    volumes:
      - testpgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations_v2:/migrations:ro
    command:
      [
        "-path", "/migrations",
        "-database", "postgres://${POSTGRES_USER:-web}:${POSTGRES_PASSWORD:-pass}@db:5432/${POSTGRES_DB:-snippetbox}?sslmode=disable",
        "up"
      ]
    restart: "no"

  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-4000}:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command:
      - ./server
      - -dsn=${SNIPPETBOX_DSN:-postgres://web:pass@db:5432/snippetbox?sslmode=disable}
      - -static-dir=/app/ui/static
      - -redis-addr=${REDIS_ADDR:-redis:6379}
      - -redis-password=${REDIS_PASSWORD:-}
      - -redis-db=${REDIS_DB:-0}
    volumes:
      - uploads:/app/upload

  caddy:
    profiles: ["prod"]
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      app:
        condition: service_started

  test:
    profiles: ["test"]
    image: golang:1.25.6
    working_dir: /app
    depends_on:
      test-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    environment:
      SNIPPETBOX_TEST_DSN: postgres://${TEST_POSTGRES_USER:-test_web}:${TEST_POSTGRES_PASSWORD:-pass}@test-db:5432/${TEST_POSTGRES_DB:-test_snippetbox}?sslmode=disable
      SNIPPETBOX_TEST_REDIS_ADDR: redis:6379
      SNIPPETBOX_TEST_REDIS_DB: "1"
    command: ["sh", "-c", "go mod tidy && go test ./..."]
volumes:
  pgdata:
  redisdata:
  testpgdata:
  caddydata:
  caddyconfig:
  uploads:
