name: CI

on:
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: test_snippetbox
          POSTGRES_USER: test_web
          POSTGRES_PASSWORD: pass
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test_web -d test_snippetbox"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
      redis:
        image: redis:7
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      SNIPPETBOX_TEST_DSN: postgres://test_web:pass@127.0.0.1:5433/test_snippetbox?sslmode=disable
      SNIPPETBOX_TEST_REDIS_ADDR: 127.0.0.1:6380
      SNIPPETBOX_TEST_REDIS_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./cmd/web
      - name: Build container
        run: docker build -t snippetbox:ci .

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Firefox
        run: npx playwright install --with-deps firefox
      - name: Run browser tests
        run: ./scripts/test-e2e.sh
