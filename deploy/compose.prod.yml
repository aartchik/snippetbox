services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - redisdata:/data

  migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../migrations_v2:/migrations:ro
    command:
      - -path
      - /migrations
      - -database
      - ${SNIPPETBOX_DSN:?SNIPPETBOX_DSN is required}
      - up
    restart: "no"

  app:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command:
      - ./server
      - -dsn=${SNIPPETBOX_DSN:?SNIPPETBOX_DSN is required}
      - -static-dir=/app/ui/static
      - -redis-addr=redis:6379
      - -redis-password=${REDIS_PASSWORD:-}
      - -redis-db=${REDIS_DB:-0}
    ports:
      - 127.0.0.1:4000:4000
    volumes:
      - uploads:/app/upload

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      app:
        condition: service_started

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
  uploads:
